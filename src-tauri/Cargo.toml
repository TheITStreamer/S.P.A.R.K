[package]
name = "spark"
version = "0.9.1"
description = "S.P.A.R.K. - Streaming Panel for Alerts, Redeems and Key tools"
authors = ["SPARK"]
edition = "2021"

[lib]
name = "spark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Simulated keyboard input for the Commands tab's keypress action. Windows only
# by intent — SPARK is a Windows app — but the crate itself is cross-platform.
# 0.6 specifically: the Settings / Direction / Keyboard-trait API used in
# send_keypress was verified against the 0.6.1 docs. Earlier versions differ.
enigo = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
